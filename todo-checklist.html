<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>할일 목록</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:       #f5f5f7;
  --surface:  #ffffff;
  --surface2: #f5f5f7;
  --surface3: #ebebed;
  --text:     #1d1d1f;
  --text2:    #6e6e73;
  --text3:    #aeaeb2;
  --border:   rgba(0,0,0,0.08);
  --border2:  rgba(0,0,0,0.13);
  --accent:   #007aff;
  --red:      #ff3b30;
  --green:    #34c759;
  --orange:   #ff9500;
  --purple:   #af52de;
  --shadow:   0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.06);
  --radius:   14px;
  --r-sm:     9px;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg:       #000000;
    --surface:  #1c1c1e;
    --surface2: #2c2c2e;
    --surface3: #3a3a3c;
    --text:     #f5f5f7;
    --text2:    #98989d;
    --text3:    #636366;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.14);
    --shadow:   0 2px 12px rgba(0,0,0,0.4);
    --shadow-lg:0 12px 40px rgba(0,0,0,0.55);
  }
}

html, body {
  height:100%; width:100%;
  background:var(--bg);
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ── LAYOUT ── */
.app { display:flex; flex-direction:column; min-height:100vh; max-width:780px; margin:0 auto; padding:0 0 80px; }

/* ── SETUP BANNER ── */
.setup-banner { background:linear-gradient(135deg,#007aff,#34aadc); color:#fff; padding:11px 18px; font-size:13px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.setup-banner.hidden { display:none; }
.setup-input { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); border-radius:7px; color:#fff; padding:6px 11px; font-size:12px; width:300px; outline:none; }
.setup-input::placeholder { color:rgba(255,255,255,.55); }
.setup-save  { background:#fff; color:#007aff; border:none; border-radius:7px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
.setup-close { background:none; border:none; color:rgba(255,255,255,.7); font-size:18px; cursor:pointer; margin-left:auto; line-height:1; }

/* ── HEADER ── */
.header { padding:28px 20px 0; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.header-title { font-size:34px; font-weight:700; letter-spacing:-.5px; line-height:1; }
.header-sub   { font-size:14px; color:var(--text2); margin-top:5px; }
.header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }

.sync-badge { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text3); padding:5px 11px; border-radius:20px; background:var(--surface); border:0.5px solid var(--border2); box-shadow:var(--shadow); }
.sync-dot   { width:7px; height:7px; border-radius:50%; background:var(--text3); flex-shrink:0; transition:background .3s; }
.sync-badge.synced  .sync-dot { background:var(--green); }
.sync-badge.syncing .sync-dot { background:var(--orange); animation:pulse 1s infinite; }
.sync-badge.error   .sync-dot { background:var(--red); }

@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
@keyframes spin   { to{transform:rotate(360deg)} }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes slideIn{ from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:none} }
@keyframes check  { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }

/* ── FILTER TABS ── */
.filter-bar { display:flex; gap:6px; padding:18px 20px 0; overflow-x:auto; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.ftab { display:flex; align-items:center; gap:5px; padding:7px 14px; border-radius:20px; border:0.5px solid var(--border2); background:var(--surface); font-size:13px; font-weight:500; color:var(--text2); cursor:pointer; white-space:nowrap; box-shadow:var(--shadow); transition:all .15s; user-select:none; }
.ftab:hover { background:var(--surface2); }
.ftab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.ftab .cnt { font-size:11px; font-weight:600; background:rgba(255,255,255,.25); padding:1px 6px; border-radius:10px; }
.ftab:not(.active) .cnt { background:var(--surface2); color:var(--text3); }

/* ── STATS ROW ── */
.stats-row { display:flex; gap:10px; padding:14px 20px 0; }
.stat-card { flex:1; background:var(--surface); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); border:0.5px solid var(--border); }
.stat-num  { font-size:26px; font-weight:700; letter-spacing:-.5px; line-height:1; }
.stat-lbl  { font-size:11px; color:var(--text2); margin-top:3px; font-weight:500; }
.stat-card.s-blue   .stat-num { color:var(--accent); }
.stat-card.s-green  .stat-num { color:var(--green); }
.stat-card.s-orange .stat-num { color:var(--orange); }

/* ── PROGRESS ── */
.progress-wrap { margin:14px 20px 0; background:var(--surface); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); border:0.5px solid var(--border); }
.progress-top  { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.progress-lbl  { font-size:13px; font-weight:600; }
.progress-pct  { font-size:13px; font-weight:700; color:var(--accent); }
.progress-bar  { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),#34aadc); border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1); }

/* ── ADD FORM ── */
.add-form { margin:14px 20px 0; background:var(--surface); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); border:0.5px solid var(--border); }
.add-row  { display:flex; gap:8px; margin-bottom:10px; }
.add-input { flex:1; height:42px; border:0.5px solid var(--border2); border-radius:var(--r-sm); padding:0 14px; font-size:15px; font-family:inherit; color:var(--text); background:var(--surface2); outline:none; transition:border-color .15s,box-shadow .15s; }
.add-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,122,255,.14); }
.add-input::placeholder { color:var(--text3); }
.add-opts { display:flex; gap:8px; align-items:center; }
.a-select { height:36px; border:0.5px solid var(--border2); border-radius:var(--r-sm); padding:0 10px; font-size:13px; font-family:inherit; color:var(--text); background:var(--surface2); outline:none; cursor:pointer; -webkit-appearance:none; appearance:none; }
.a-select:focus { border-color:var(--accent); }
.btn-add-todo { height:42px; padding:0 20px; border-radius:var(--r-sm); border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; transition:background .15s,transform .1s; white-space:nowrap; }
.btn-add-todo:hover  { background:#0066d6; }
.btn-add-todo:active { transform:scale(.97); }
.btn-add-todo:disabled { background:var(--text3); cursor:not-allowed; }

/* ── SECTION ── */
.section { margin:18px 20px 0; }
.section-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:0 2px; }
.section-title { font-size:12px; font-weight:600; color:var(--text3); letter-spacing:.5px; text-transform:uppercase; }
.section-action { font-size:12px; color:var(--accent); cursor:pointer; font-weight:500; }
.section-action:hover { text-decoration:underline; }

/* ── TODO LIST ── */
.todo-list { display:flex; flex-direction:column; gap:1px; }

.todo-item {
  display:flex; align-items:flex-start; gap:12px;
  background:var(--surface); padding:13px 14px;
  border-radius:0; border-bottom:0.5px solid var(--border);
  transition:background .12s, opacity .2s;
  animation:slideIn .18s ease;
  cursor:default;
  position:relative;
}
.todo-list .todo-item:first-child { border-radius:var(--radius) var(--radius) 0 0; }
.todo-list .todo-item:last-child  { border-radius:0 0 var(--radius) var(--radius); border-bottom:none; }
.todo-list .todo-item:only-child  { border-radius:var(--radius); border-bottom:none; }
.todo-item:hover { background:color-mix(in srgb,var(--accent) 2%,var(--surface)); }
.todo-item.done  { opacity:.55; }
.todo-item.done .todo-text { text-decoration:line-through; color:var(--text3); }

/* checkbox */
.chk-wrap { flex-shrink:0; margin-top:1px; }
.chk { width:22px; height:22px; border-radius:50%; border:2px solid var(--border2); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s; flex-shrink:0; }
.chk:hover { border-color:var(--accent); }
.chk.checked { background:var(--green); border-color:var(--green); animation:check .25s ease; }
.chk svg { display:none; }
.chk.checked svg { display:block; }

/* text */
.todo-content { flex:1; min-width:0; }
.todo-text    { font-size:15px; font-weight:400; line-height:1.4; word-break:break-word; color:var(--text); }
.todo-meta    { display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap; }
.meta-tag     { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:500; }
.mt-cat  { background:var(--surface2); color:var(--text2); }
.mt-high { background:rgba(255,59,48,.11);  color:#ff3b30; }
.mt-low  { background:rgba(52,199,89,.12);  color:#248a3d; }
.mt-norm { background:rgba(142,142,147,.12);color:#6c6c70; }
@media (prefers-color-scheme:dark) {
  .mt-high { background:rgba(255,69,58,.22);  color:#ff453a; }
  .mt-low  { background:rgba(48,209,88,.18);  color:#30d158; }
  .mt-norm { background:rgba(152,152,157,.18);color:#98989d; }
}

/* actions */
.todo-actions { display:flex; gap:4px; opacity:0; transition:opacity .15s; flex-shrink:0; }
.todo-item:hover .todo-actions { opacity:1; }
.act-btn { width:28px; height:28px; border-radius:8px; border:none; background:var(--surface2); color:var(--text2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:background .12s,color .12s; }
.act-btn:hover { background:var(--border); }
.act-btn.del:hover { background:rgba(255,59,48,.12); color:var(--red); }

/* ── EMPTY STATE ── */
.empty-state { text-align:center; padding:48px 20px; color:var(--text3); }
.empty-icon  { font-size:48px; margin-bottom:12px; }
.empty-text  { font-size:15px; font-weight:500; }
.empty-sub   { font-size:13px; margin-top:4px; }

/* ── COMPLETED SECTION TOGGLE ── */
.comp-toggle { display:flex; align-items:center; gap:8px; padding:12px 0 0; cursor:pointer; color:var(--text2); font-size:13px; font-weight:500; user-select:none; }
.comp-toggle:hover { color:var(--text); }
.comp-arrow  { font-size:11px; transition:transform .2s; }
.comp-arrow.open { transform:rotate(90deg); }

/* ── TOAST ── */
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--surface); padding:11px 22px; border-radius:22px; font-size:13px; font-weight:500; opacity:0; transition:opacity .22s,transform .22s; pointer-events:none; z-index:999; white-space:nowrap; box-shadow:var(--shadow-lg); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── LOADING ── */
.loading-ov { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:500; transition:opacity .3s; }
.loading-ov.hidden { opacity:0; pointer-events:none; }
.spinner    { width:32px; height:32px; border:3px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
.loading-txt{ font-size:14px; color:var(--text2); }

/* ── EDIT INLINE ── */
.edit-input { flex:1; height:28px; border:none; border-bottom:1.5px solid var(--accent); background:transparent; font-size:15px; font-family:inherit; color:var(--text); outline:none; padding:0 2px; }
</style>
</head>
<body>

<!-- SETUP BANNER -->
<div class="setup-banner" id="setupBanner">
  <span>⚙️ Apps Script URL 설정 필요</span>
  <input class="setup-input" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec" />
  <button class="setup-save" onclick="saveUrl()">저장</button>
  <button class="setup-close" onclick="document.getElementById('setupBanner').classList.add('hidden')">✕</button>
</div>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="header-title">할일 목록</div>
      <div class="header-sub" id="headerSub">오늘도 하나씩 해내봐요</div>
    </div>
    <div class="header-right">
      <div class="sync-badge" id="syncBadge">
        <div class="sync-dot"></div>
        <span id="syncTxt">연결 안됨</span>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card s-blue">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-lbl">전체</div>
    </div>
    <div class="stat-card s-green">
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-lbl">완료</div>
    </div>
    <div class="stat-card s-orange">
      <div class="stat-num" id="statLeft">0</div>
      <div class="stat-lbl">남은 할일</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-lbl">진행률</span>
      <span class="progress-pct" id="progPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progFill" style="width:0%"></div>
    </div>
  </div>

  <!-- FILTER TABS -->
  <div class="filter-bar">
    <div class="ftab active" data-filter="all"    onclick="setFilter('all')">전체 <span class="cnt" id="cntAll">0</span></div>
    <div class="ftab"        data-filter="todo"   onclick="setFilter('todo')">미완료 <span class="cnt" id="cntTodo">0</span></div>
    <div class="ftab"        data-filter="done"   onclick="setFilter('done')">완료 <span class="cnt" id="cntDone">0</span></div>
    <div class="ftab"        data-filter="high"   onclick="setFilter('high')">🔴 높음 <span class="cnt" id="cntHigh">0</span></div>
    <div class="ftab"        data-filter="업무"   onclick="setFilter('업무')">💼 업무 <span class="cnt" id="cnt업무">0</span></div>
    <div class="ftab"        data-filter="개인"   onclick="setFilter('개인')">👤 개인 <span class="cnt" id="cnt개인">0</span></div>
    <div class="ftab"        data-filter="가족"   onclick="setFilter('가족')">👨‍👩‍👧 가족 <span class="cnt" id="cnt가족">0</span></div>
    <div class="ftab"        data-filter="건강"   onclick="setFilter('건강')">💪 건강 <span class="cnt" id="cnt건강">0</span></div>
  </div>

  <!-- ADD FORM -->
  <div class="add-form">
    <div class="add-row">
      <input class="add-input" id="newTodo" placeholder="새 할일을 입력하세요..." />
      <button class="btn-add-todo" id="btnAdd" onclick="addTodo()">추가</button>
    </div>
    <div class="add-opts">
      <select class="a-select" id="newCat">
        <option value="">카테고리</option>
        <option value="업무">💼 업무</option>
        <option value="개인">👤 개인</option>
        <option value="가족">👨‍👩‍👧 가족</option>
        <option value="건강">💪 건강</option>
        <option value="기념일">🎉 기념일</option>
      </select>
      <select class="a-select" id="newPri">
        <option value="보통">🟡 보통</option>
        <option value="높음">🔴 높음</option>
        <option value="낮음">🟢 낮음</option>
      </select>
    </div>
  </div>

  <!-- TODO LIST -->
  <div class="section" id="todoSection">
    <div class="section-hdr">
      <span class="section-title">할일 <span id="todoCount"></span></span>
      <span class="section-action" onclick="clearCompleted()">완료 항목 삭제</span>
    </div>
    <div class="todo-list" id="todoList"></div>
  </div>

</div>

<!-- LOADING -->
<div class="loading-ov" id="loadOv">
  <div class="spinner"></div>
  <div class="loading-txt">불러오는 중...</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────
let todos     = [];
let filter    = 'all';
let scriptUrl = localStorage.getItem('todo_url') || localStorage.getItem('cal_url') || '';
let posting   = false;
let syncTimer = null;

// ── URL SETUP ────────────────────────────────────────────────
function saveUrl() {
  const v = document.getElementById('urlInput').value.trim();
  if (!v.startsWith('https://script.google.com')) { showToast('올바른 URL을 입력해 주세요'); return; }
  scriptUrl = v;
  localStorage.setItem('todo_url', scriptUrl);
  localStorage.setItem('cal_url',  scriptUrl); // 캘린더와 공유
  document.getElementById('setupBanner').classList.add('hidden');
  showToast('저장됐습니다!');
  fetchTodos();
}

function initSetup() {
  if (scriptUrl) {
    document.getElementById('setupBanner').classList.add('hidden');
    document.getElementById('urlInput').value = scriptUrl;
  }
}

// ── SYNC ─────────────────────────────────────────────────────
function setSync(state, txt) {
  const b = document.getElementById('syncBadge');
  b.className = 'sync-badge ' + state;
  document.getElementById('syncTxt').textContent = txt;
}

function nowTime() { return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }

// ── API ──────────────────────────────────────────────────────
async function fetchTodos() {
  if (!scriptUrl) { hideLoad(); return; }
  setSync('syncing','동기화 중...');
  try {
    const r = await fetch(scriptUrl + '?action=getTodos', {cache:'no-store'});
    const d = await r.json();
    if (Array.isArray(d.todos)) {
      todos = d.todos;
      render();
      setSync('synced', nowTime() + ' 동기화');
    } else { setSync('error','응답 오류'); }
  } catch(e) {
    setSync('error','연결 실패');
    showToast('서버 연결에 실패했습니다');
  }
  hideLoad();
}

async function apiAdd(todo) {
  if (!scriptUrl) { showToast('⚙️ URL을 먼저 설정해 주세요'); return null; }
  setSync('syncing','저장 중...');
  try {
    const r = await fetch(scriptUrl, {method:'POST', body:JSON.stringify({action:'addTodo', todo})});
    const d = await r.json();
    if (d.success) { setSync('synced','저장됨'); return d.id; }
    setSync('error','저장 실패'); return null;
  } catch(e) { setSync('error','연결 실패'); return null; }
}

async function apiUpdate(todo) {
  if (!scriptUrl) return;
  setSync('syncing','업데이트 중...');
  try {
    await fetch(scriptUrl, {method:'POST', body:JSON.stringify({action:'updateTodo', todo})});
    setSync('synced','완료');
  } catch(e) { setSync('error','실패'); }
}

async function apiDelete(id) {
  if (!scriptUrl) return;
  setSync('syncing','삭제 중...');
  try {
    await fetch(scriptUrl, {method:'POST', body:JSON.stringify({action:'deleteTodo', id})});
    setSync('synced','완료');
  } catch(e) { setSync('error','실패'); }
}

function startRefresh() {
  clearInterval(syncTimer);
  syncTimer = setInterval(() => { if (!posting && scriptUrl) fetchTodos(); }, 20000);
}

// ── RENDER ───────────────────────────────────────────────────
function filtered() {
  if (filter === 'all')  return todos;
  if (filter === 'todo') return todos.filter(t => !t.done);
  if (filter === 'done') return todos.filter(t =>  t.done);
  if (filter === 'high') return todos.filter(t => t.priority === '높음');
  return todos.filter(t => t.category === filter);
}

function render() {
  updateStats();
  updateCounts();
  const list  = document.getElementById('todoList');
  const items = filtered();
  list.innerHTML = '';

  if (!items.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${filter==='done' ? '✅' : '📋'}</div>
        <div class="empty-text">${filter==='done' ? '완료된 항목이 없어요' : '할일이 없습니다'}</div>
        <div class="empty-sub">${filter==='done' ? '열심히 해보세요!' : '위에서 새 할일을 추가해 보세요'}</div>
      </div>`;
    return;
  }

  // Sort: undone first, then by priority (높음→보통→낮음), then by createdAt
  const priOrder = {높음:0, 보통:1, 낮음:2};
  const sorted = [...items].sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const pa = priOrder[a.priority] ?? 1, pb = priOrder[b.priority] ?? 1;
    if (pa !== pb) return pa - pb;
    return (a.createdAt||'').localeCompare(b.createdAt||'');
  });

  sorted.forEach(t => {
    const el = makeTodoEl(t);
    list.appendChild(el);
  });

  document.getElementById('todoCount').textContent = `(${items.filter(t=>!t.done).length}/${items.length})`;
}

function makeTodoEl(t) {
  const div = document.createElement('div');
  div.className = 'todo-item' + (t.done ? ' done' : '');
  div.dataset.id = t.id;

  // checkbox
  const chkW = document.createElement('div'); chkW.className = 'chk-wrap';
  const chk  = document.createElement('div'); chk.className = 'chk' + (t.done ? ' checked' : '');
  chk.innerHTML = `<svg width="12" height="9" viewBox="0 0 12 9" fill="none"><path d="M1 4L4.5 7.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  chk.onclick = () => toggleDone(t.id);
  chkW.appendChild(chk);

  // content
  const cont = document.createElement('div'); cont.className = 'todo-content';
  const txt  = document.createElement('div'); txt.className = 'todo-text'; txt.textContent = t.text;
  cont.appendChild(txt);

  // meta tags
  const meta = document.createElement('div'); meta.className = 'todo-meta';
  if (t.category) {
    const c = document.createElement('span'); c.className = 'meta-tag mt-cat'; c.textContent = t.category; meta.appendChild(c);
  }
  if (t.priority) {
    const cls = t.priority==='높음' ? 'mt-high' : t.priority==='낮음' ? 'mt-low' : 'mt-norm';
    const p = document.createElement('span'); p.className = 'meta-tag ' + cls;
    p.textContent = (t.priority==='높음'?'🔴 ':t.priority==='낮음'?'🟢 ':'🟡 ') + t.priority;
    meta.appendChild(p);
  }
  if (meta.children.length) cont.appendChild(meta);

  // actions
  const acts = document.createElement('div'); acts.className = 'todo-actions';

  const editBtn = document.createElement('button'); editBtn.className = 'act-btn';
  editBtn.title = '편집'; editBtn.textContent = '✏️';
  editBtn.onclick = () => startEdit(t.id, txt, div);

  const delBtn = document.createElement('button'); delBtn.className = 'act-btn del';
  delBtn.title = '삭제'; delBtn.textContent = '🗑';
  delBtn.onclick = () => deleteTodo(t.id);

  acts.appendChild(editBtn); acts.appendChild(delBtn);

  div.appendChild(chkW); div.appendChild(cont); div.appendChild(acts);
  return div;
}

// ── ACTIONS ──────────────────────────────────────────────────
async function addTodo() {
  const text = document.getElementById('newTodo').value.trim();
  if (!text) { document.getElementById('newTodo').focus(); return; }
  if (posting) return;
  posting = true;
  const btn = document.getElementById('btnAdd'); btn.disabled=true; btn.textContent='추가 중...';

  const todo = {
    text,
    category: document.getElementById('newCat').value,
    priority: document.getElementById('newPri').value || '보통',
  };
  const newId = await apiAdd(todo);
  if (newId) {
    todo.id = newId; todo.done = false; todo.createdAt = new Date().toISOString();
    todos.push(todo);
    document.getElementById('newTodo').value = '';
    document.getElementById('newCat').value  = '';
    document.getElementById('newPri').value  = '보통';
    render();
    showToast('추가됐습니다 ✓');
  }
  btn.disabled=false; btn.textContent='추가'; posting=false;
}

async function toggleDone(id) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  render();
  await apiUpdate({id: t.id, done: t.done});
  if (t.done) confetti();
}

async function deleteTodo(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  todos = todos.filter(t => t.id !== id);
  render();
  await apiDelete(id);
  showToast('삭제됐습니다');
}

async function clearCompleted() {
  const done = todos.filter(t => t.done);
  if (!done.length) { showToast('완료된 항목이 없습니다'); return; }
  if (!confirm(`완료된 ${done.length}개를 모두 삭제할까요?`)) return;
  todos = todos.filter(t => !t.done);
  render();
  showToast(`${done.length}개 삭제됐습니다`);
  for (const t of done) await apiDelete(t.id);
}

function startEdit(id, txtEl, itemEl) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const input = document.createElement('input');
  input.className = 'edit-input';
  input.value = t.text;
  txtEl.replaceWith(input);
  input.focus();
  input.select();
  const save = async () => {
    const newText = input.value.trim();
    if (!newText) { input.replaceWith(txtEl); return; }
    t.text = newText; txtEl.textContent = newText; input.replaceWith(txtEl);
    await apiUpdate({id: t.id, text: t.text});
    showToast('수정됐습니다');
  };
  input.onblur   = save;
  input.onkeydown = e => { if(e.key==='Enter') save(); if(e.key==='Escape') input.replaceWith(txtEl); };
}

// ── FILTER ───────────────────────────────────────────────────
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.ftab').forEach(el => el.classList.toggle('active', el.dataset.filter === f));
  render();
}

// ── STATS ────────────────────────────────────────────────────
function updateStats() {
  const total = todos.length;
  const done  = todos.filter(t=>t.done).length;
  const left  = total - done;
  const pct   = total ? Math.round(done/total*100) : 0;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent  = done;
  document.getElementById('statLeft').textContent  = left;
  document.getElementById('progPct').textContent   = pct + '%';
  document.getElementById('progFill').style.width  = pct + '%';
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('headerSub').textContent = `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
}

function updateCounts() {
  const cnt = (f) => f === 'all'  ? todos.length
    : f === 'todo' ? todos.filter(t=>!t.done).length
    : f === 'done' ? todos.filter(t=>t.done).length
    : f === 'high' ? todos.filter(t=>t.priority==='높음').length
    : todos.filter(t=>t.category===f).length;

  ['all','todo','done','high','업무','개인','가족','건강'].forEach(f => {
    const el = document.getElementById('cnt'+f);
    if (el) el.textContent = cnt(f);
  });
}

// ── CONFETTI (간단 버전) ──────────────────────────────────────
function confetti() {
  const colors = ['#007aff','#34c759','#ff9500','#af52de','#ff2d55'];
  for (let i=0; i<18; i++) {
    const p = document.createElement('div');
    const size = Math.random()*6+4;
    p.style.cssText = `position:fixed;width:${size}px;height:${size}px;border-radius:${Math.random()>0.5?'50%':'2px'};background:${colors[i%colors.length]};left:${Math.random()*100}vw;top:-10px;z-index:9999;pointer-events:none;animation:fall ${Math.random()*.8+.7}s ease-in forwards;`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1500);
  }
}
const style = document.createElement('style');
style.textContent = `@keyframes fall{to{transform:translateY(110vh) rotate(${Math.random()*360}deg);opacity:0}}`;
document.head.appendChild(style);

// ── UTILS ────────────────────────────────────────────────────
function showToast(msg, dur=2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}
function hideLoad() { document.getElementById('loadOv').classList.add('hidden'); }

// ── KEYBOARD ─────────────────────────────────────────────────
document.getElementById('newTodo').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});

// ── INIT ─────────────────────────────────────────────────────
initSetup();
render();
if (scriptUrl) { fetchTodos(); } else { hideLoad(); setSync('error','URL 미설정'); }
startRefresh();
</script>
